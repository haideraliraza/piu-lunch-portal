name: Android APK Build

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node.js Runtime Engine
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Android SDK Capabilities
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licences automatically
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Global Cordova CLI
      run: |
        npm install -g cordova

    - name: Initialize App Container and Compile APK
      run: |
        # 1. Initialize fresh project container
        cordova create lunch-build-container com.piu.lunchportal "PIU Lunch Portal"
        cd lunch-build-container
        
        # 2. Inject your Supabase frontend asset
        rm -rf www/*
        cp ../index.html www/index.html
        
        # 3. Provision native platform
        cordova platform add android
        
        # 4. Compile application package with absolute path exposure
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        
        echo "=== Launching Cordova Compilation Pipeline ==="
        cordova build android --release --no-telemetry -- --packageType=apk || exit 1
        
        # 5. Locate the raw unsigned APK file
        UNSIGNED_APK=$(find platforms/android/app/build/outputs/apk/release/ -name "*-unsigned.apk" | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          UNSIGNED_APK=$(find platforms/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        fi
        
        echo "Found target binary at: $UNSIGNED_APK"
        
        # 6. Generate a temporary keystore file to sign the app automatically
        keytool -genkey -v -keystore release.keystore -alias piu_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass piu_password -keypass piu_password -dname "CN=piu.gov, OU=IT, O=PIU, L=Islamabad, S=Federal, C=PK"
        
        # 7. Use Android SDK build tools to optimize and sign the binary
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
        
        # Optimize alignment for hardware execution memory
        $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED_APK" ../piu-lunch-portal-aligned.apk
        
        # Cryptographically sign the APK file so Android phones accept it
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:piu_password --key-pass pass:piu_password --out ../piu-lunch-portal.apk ../piu-lunch-portal-aligned.apk
        
        echo "=== Success! Cryptographically signed binary moved to root ==="

    - name: Upload Downloadable APK Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: piu-lunch-app-apk
        path: piu-lunch-portal.apk
