name: Android APK Build

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node.js Runtime Engine
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Android SDK Capabilities
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licences automatically
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Global CLI Bundles
      run: |
        npm install -g cordova

    - name: Install Dependencies and Assemble Assets
      run: |
        if [ -f package.json ]; then npm install; fi

    - name: Build Android Platform Target Packages
      run: |
        # We removed "cd lunch-app" because your files are in the main folder
        cordova platform rm android --noscript || true
        cordova platform add android
        
    - name: Compile distribution Android production ready binary built packages
      run: |
        # Building directly from the root folder
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        cordova build android --release --no-telemetry
