name: Android APK Build

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node.js Runtime Engine
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Android SDK Capabilities
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licences automatically
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Global Cordova CLI
      run: |
        npm install -g cordova

    - name: Initialize App Container and Compile APK
      run: |
        # 1. Initialize fresh project container
        cordova create lunch-build-container com.piu.lunchportal "PIU Lunch Portal"
        cd lunch-build-container
        
        # 2. Inject your Supabase frontend asset
        rm -rf www/*
        cp ../index.html www/index.html
        
        # 3. Provision native platform
        cordova platform add android
        
        # 4. Compile application package with absolute path exposure
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        
        echo "=== Launching Cordova Compilation Pipeline ==="
        # Run compilation. If it fails, the "|| exit 1" forces GitHub to turn red and stop right here.
        cordova build android --release --no-telemetry || exit 1
        
        # 5. Extract the generated APK and copy it safely to the main repository root
        echo "=== Locating compiled binaries ==="
        APK_COUNT=$(find . -name "*.apk" | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "ERROR: Cordova claimed success but zero APK files exist in the build directory."
          exit 1
        fi
        
        find . -name "*.apk" -exec cp {} ../piu-lunch-portal.apk \;
        echo "=== Success! Binary moved to root ==="

    - name: Upload Downloadable APK Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: piu-lunch-app-apk
        path: piu-lunch-portal.apk
