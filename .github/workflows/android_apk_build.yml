name: Android APK Build

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Node.js Runtime Engine
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Android SDK Capabilities
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licences automatically
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Global Cordova CLI
      run: |
        npm install -g cordova

    - name: Initialize App Container and Compile APK
      run: |
        # 1. Create a fresh Cordova project folder inside the runner workspace
        cordova create lunch-build-container com.piu.lunchportal "PIU Lunch Portal"
        
        # 2. Move into that fresh project directory
        cd lunch-build-container
        
        # 3. Clear out Cordova's default placeholder web page files
        rm -rf www/*
        
        # 4. Copy your custom Supabase index.html file into the Cordova web assets directory
        cp ../index.html www/index.html
        
        # 5. Add the clean native Android platform layer
        cordova platform add android
        
        # 6. Compile your distribution production-ready release binary package
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        cordova build android --release --no-telemetry

    - name: Upload Downloadable APK Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: piu-lunch-app-apk
        path: lunch-build-container/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
