<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIU Lunch Balance Management System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div id="root"></div>

  <script>
    const SUPABASE_URL = "https://clwcslxcsbvhxxinomuq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsd2NzbHhjc2J2aHh4aW5vbXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDIyODEsImV4cCI6MjA5NjU3ODI4MX0.ldUA1tK2kgwvvMGgePwQ5eTYTgFMVYAd6t_hbR9-VNY";

    const supabaseRequest = async (endpoint, options = {}) => {
        const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
        const headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Accept-Profile": "public",
          "Content-Profile": "public",
          "Prefer": "return=representation",
          ...options.headers
        };

        const response = await fetch(url, { ...options, headers });
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`API Error ${response.status}: ${errorText}`);
        }
        if (response.status === 204) return null;
        return await response.json();
    };

    function App() {
      const [user, setUser] = React.useState(null);
      const [loginForm, setLoginForm] = React.useState({ username: "", password: "" });
      const [loginError, setLoginError] = React.useState("");
      const [loading, setLoading] = React.useState(false);
      const [users, setUsers] = React.useState([]);
      const [transactions, setTransactions] = React.useState([]);
      const [activeTab, setActiveTab] = React.useState("dashboard");

      const [newUser, setNewUser] = React.useState({ username: "", password: "" });
      const [creditForm, setCreditForm] = React.useState({ username: "", amount: "", remarks: "" });
      const [bulkSelection, setBulkSelection] = React.useState({});
      const [bulkAmountType, setBulkAmountType] = React.useState("flat"); 
      const [flatAmount, setFlatAmount] = React.useState("350");
      const [customAmounts, setCustomAmounts] = React.useState({});
      const [deductionRemarks, setDeductionRemarks] = React.useState("Daily Lunch Deduction");

      React.useEffect(() => {
        if (user && user.username) { 
          loadData(); 
        }
      }, [activeTab, !!user]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setLoginError("");
        try {
          const cleanUsername = loginForm.username.toLowerCase().trim();
          const data = await supabaseRequest(`profiles?username=eq.${encodeURIComponent(cleanUsername)}&select=*`);
          
          if (!data) {
            setLoginError("Invalid response from database.");
          } else if (data.length === 0) {
            setLoginError("Invalid username or password.");
          } else if (data[0].password !== loginForm.password) {
            setLoginError("Invalid username or password.");
          } else {
            setUser({ username: data[0].username, role: data[0].role, balance: data[0].balance });
          }
        } catch (err) {
          setLoginError(err.message);
        }
        setLoading(false);
      };

      const loadData = async () => {
        setLoading(true);
        try {
          const fetchedUsers = await supabaseRequest("profiles?select=*&order=username.asc");
          setUsers(fetchedUsers);
          
          if (user && user.username) {
            const self = fetchedUsers.find(u => u.username === user.username);
            if (self) {
              if (self.balance !== user.balance) { 
                setUser(prev => ({ ...prev, balance: self.balance })); 
              }
            } else {
              setUser(null);
              return;
            }
          }

          const fetchedTx = await supabaseRequest("transactions?select=*&order=timestamp.desc&limit=50");
          setTransactions(fetchedTx);
        } catch (err) {
          console.error("Error refreshing system metrics: " + err.message);
        }
        setLoading(false);
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          await supabaseRequest("profiles", {
            method: "POST",
            body: JSON.stringify({ username: newUser.username, password: newUser.password, role: "Simple User", balance: 0 })
          });
          alert("User created successfully!");
          setNewUser({ username: "", password: "" });
          loadData();
        } catch (err) { alert(err.message); }
        setLoading(false);
      };

      const handleAddCredit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const target = users.find(u => u.username === creditForm.username);
          const newBalance = Number(target.balance) + Number(creditForm.amount);
          
          await supabaseRequest(`profiles?username=eq.${encodeURIComponent(target.username)}`, {
            method: "PATCH",
            body: JSON.stringify({ balance: newBalance })
          });

          await supabaseRequest("transactions", {
            method: "POST",
            body: JSON.stringify({ target_user: target.username, type: "Credit", amount: creditForm.amount, executed_by: user.username, remarks: creditForm.remarks })
          });

          alert("Credit added successfully!");
          setCreditForm({ username: "", amount: "", remarks: "" });
          loadData();
        } catch (err) { alert(err.message); }
        setLoading(false);
      };

      const executeBulkDeduction = async () => {
        const targets = Object.keys(bulkSelection).filter(k => bulkSelection[k]);
        if (targets.length === 0) { alert("Select at least one user."); return; }
        setLoading(true);

        try {
          for (let username of targets) {
            const target = users.find(u => u.username === username);
            if (!target) continue;

            const amt = bulkAmountType === "flat" ? Number(flatAmount) : Number(customAmounts[username] || 0);
            const newBalance = Number(target.balance) - amt;

            await supabaseRequest(`profiles?username=eq.${encodeURIComponent(username)}`, {
              method: "PATCH",
              body: JSON.stringify({ balance: newBalance })
            });

            await supabaseRequest("transactions", {
              method: "POST",
              body: JSON.stringify({ target_user: target.username, type: "Deduction", amount: amt, executed_by: user.username, remarks: deductionRemarks })
            });
          }
          alert("Deductions processed successfully.");
          setBulkSelection({});
          setCustomAmounts({});
          loadData();
        } catch (err) { alert(err.message); }
        setLoading(false);
      };

      const toggleRole = async (targetUser, currentRole) => {
        const newRole = currentRole === "Super User" ? "Simple User" : "Super User";
        setLoading(true);
        try {
          await supabaseRequest(`profiles?username=eq.${encodeURIComponent(targetUser)}`, {
            method: "PATCH",
            body: JSON.stringify({ role: newRole })
          });
          loadData();
        } catch (err) { alert(err.message); }
        setLoading(false);
      };

      const deleteUser = async (targetUser) => {
        if (!confirm(`Permanently delete ${targetUser}?`)) return;
        setLoading(true);
        try {
          await supabaseRequest(`profiles?username=eq.${encodeURIComponent(targetUser)}`, { method: "DELETE" });
          loadData();
        } catch (err) { alert(err.message); }
        setLoading(false);
      };

      const filterTx = (type) => transactions.filter(t => (user.role === 'Super User' || t.target_user === user.username) && t.type === type).reduce((acc, c) => acc + Number(c.amount), 0);

      // Main UI tree rendered via native React elements to skip Babel completely
      const h = React.createElement;

      if (!user) {
        return h('div', { class: "min-h-screen flex items-center justify-center p-4" },
          h('div', { class: "bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100" },
            h('div', { class: "text-center mb-6" },
              h('h1', { class: "text-3xl font-extrabold text-blue-700 tracking-tight" }, "PIU LUNCH"),
              h('p', { class: "text-gray-500 text-sm mt-1" }, "Portal Balance Management System")
            ),
            loginError && h('div', { class: "bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-4 border border-red-100" }, loginError),
            h('form', { onSubmit: handleLogin, class: "space-y-4" },
              h('div', null,
                h('label', { class: "block text-xs font-semibold uppercase tracking-wider text-gray-600" }, "Username"),
                h('input', { type: "text", required: true, class: "mt-1 block w-full p-3 border rounded-xl bg-gray-50 outline-none transition focus:bg-white focus:ring-2 focus:ring-blue-500", value: loginForm.username, onChange: e => setLoginForm({...loginForm, username: e.target.value}) })
              ),
              h('div', null,
                h('label', { class: "block text-xs font-semibold uppercase tracking-wider text-gray-600" }, "Password"),
                h('input', { type: "password", required: true, class: "mt-1 block w-full p-3 border rounded-xl bg-gray-50 outline-none transition focus:bg-white focus:ring-2 focus:ring-blue-500", value: loginForm.password, onChange: e => setLoginForm({...loginForm, password: e.target.value}) })
              ),
              h('button', { type: "submit", disabled: loading, class: "w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition disabled:opacity-50" }, 
                loading ? "Authenticating Session..." : "Secure Login"
              )
            )
          )
        );
      }

      // App Dashboard Layout View
      return h('div', { class: "min-h-screen flex flex-col" },
        h('header', { class: "bg-blue-700 text-white p-4 shadow-md flex justify-between items-center" },
          h('div', null,
            h('h1', { class: "text-xl font-black tracking-wide" }, "PIU LUNCH SYSTEM"),
            h('p', { class: "text-xs text-blue-100 opacity-90" }, "User: ", h('span', { class: "font-bold" }, user.username), ` (${user.role})`)
          ),
          h('button', { onClick: () => setUser(null), class: "bg-blue-800 px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-950 transition" }, "Log Out")
        ),
        h('div', { class: "p-4 grid grid-cols-2 md:grid-cols-3 gap-4 max-w-7xl w-full mx-auto" },
          h('div', { class: "bg-white p-4 rounded-xl shadow-sm border border-gray-100" },
            h('span', { class: "text-xs font-bold text-gray-400 uppercase tracking-wider" }, "Your Balance"),
            h('div', { class: "text-2xl font-black text-blue-600 mt-1" }, `Rs. ${user.balance}`)
          ),
          h('div', { class: "bg-white p-4 rounded-xl shadow-sm border border-gray-100" },
            h('span', { class: "text-xs font-bold text-gray-400 uppercase tracking-wider" }, "Total Credits Injected"),
            h('div', { class: "text-2xl font-black text-emerald-600 mt-1" }, `Rs. ${filterTx('Credit')}`)
          ),
          h('div', { class: "bg-white p-4 rounded-xl shadow-sm border border-gray-100 col-span-2 md:col-span-1" },
            h('span', { class: "text-xs font-bold text-gray-400 uppercase tracking-wider" }, "Total Deductions Fixed"),
            h('div', { class: "text-2xl font-black text-rose-600 mt-1" }, `Rs. ${filterTx('Deduction')}`)
          )
        ),
        h('div', { class: "px-4 flex bg-white shadow-sm border-b overflow-x-auto gap-6 justify-start md:justify-center" },
          h('button', { onClick: () => setActiveTab("dashboard"), class: `py-4 px-1 font-bold text-sm tracking-wide border-b-2 transition ${activeTab === 'dashboard' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}` }, "Transactions Ledger"),
          user.role === "Super User" && h('button', { onClick: () => setActiveTab("deduct"), class: `py-4 px-1 font-bold text-sm tracking-wide border-b-2 transition ${activeTab === 'deduct' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}` }, "Deductions Terminal"),
          user.role === "Super User" && h('button', { onClick: () => setActiveTab("users"), class: `py-4 px-1 font-bold text-sm tracking-wide border-b-2 transition ${activeTab === 'users' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500'}` }, "User Directory Control")
        ),
        h('main', { class: "flex-1 p-4 max-w-7xl w-full mx-auto" },
          loading && h('div', { class: "bg-blue-50 text-blue-700 text-center p-3 rounded-xl font-bold border border-blue-100 mb-4 animate-pulse text-sm" }, "Syncing with secure system database cloud..."),
          
          activeTab === "dashboard" && h('div', { class: "bg-white p-6 rounded-2xl shadow-sm border border-gray-100" },
            h('div', { class: "flex justify-between items-center mb-4" },
              h('h2', { class: "text-lg font-black text-gray-800" }, "System Transaction Logs"),
              h('button', { onClick: loadData, class: "text-xs bg-gray-100 text-gray-600 font-bold px-3 py-1.5 rounded-lg hover:bg-gray-200" }, "Refresh Data")
            ),
            h('div', { class: "overflow-x-auto" },
              h('table', { class: "w-full text-left text-sm" },
                h('thead', null,
                  h('tr', { class: "bg-gray-50 border-b text-gray-400 uppercase font-bold text-xs tracking-wider" },
                    h('th', { class: "p-3" }, "Date/Time"),
                    h('th', { class: "p-3" }, "Staff Target"),
                    h('th', { class: "p-3" }, "Type"),
                    h('th', { class: "p-3" }, "Amount"),
                    h('th', { class: "p-3" }, "Authorized By"),
                    h('th', { class: "p-3" }, "Remarks")
                  )
                ),
                h('tbody', { class: "divide-y text-gray-700 font-medium" },
                  transactions.filter(t => user.role === 'Super User' || t.target_user === user.username).map((t, idx) => 
                    h('tr', { key: idx, class: "hover:bg-gray-50/80" },
                      h('td', { class: "p-3 text-xs text-gray-400" }, t.timestamp ? new Date(t.timestamp).toLocaleString() : "-"),
                      h('td', { class: "p-3 font-bold text-gray-900" }, t.target_user),
                      h('td', { class: "p-3" }, h('span', { class: `px-2.5 py-1 rounded-full text-xs font-black ${t.type === 'Credit' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}` }, t.type)),
                      h('td', { class: "p-3 font-extrabold" }, `Rs. ${t.amount}`),
                      h('td', { class: "p-3 text-xs text-gray-500" }, t.executed_by),
                      h('td', { class: "p-3 text-xs max-w-xs truncate text-gray-400" }, t.remarks || "-")
                    )
                  )
                )
              )
            )
          ),

          activeTab === "deduct" && user.role === "Super User" && h('div', { class: "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4" },
            h('h2', { class: "text-lg font-black text-gray-800" }, "Batch Deduction Controls"),
            h('div', { class: "grid md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200/60" },
              h('div', null,
                h('label', { class: "block text-xs font-bold uppercase tracking-wider text-gray-500" }, "Billing Logic"),
                h('select', { class: "mt-1 w-full p-2.5 border rounded-xl bg-white font-semibold text-sm outline-none", value: bulkAmountType, onChange: e => setBulkAmountType(e.target.value) },
                  h('option', { value: "flat" }, "Standard Equal Mass Charge"),
                  h('option', { value: "custom" }, "Custom Unique User Scale Overrides")
                )
              ),
              bulkAmountType === "flat" && h('div', null,
                h('label', { class: "block text-xs font-bold uppercase tracking-wider text-gray-500" }, "Deduction Amount (Rs.)"),
                h('input', { type: "number", class: "mt-1 w-full p-2.5 border rounded-xl text-sm font-bold outline-none", value: flatAmount, onChange: e => setFlatAmount(e.target.value) })
              ),
              h('div', null,
                h('label', { class: "block text-xs font-bold uppercase tracking-wider text-gray-500" }, "Transaction Remarks Memo"),
                h('input', { type: "text", class: "mt-1 w-full p-2.5 border rounded-xl text-sm outline-none", value: deductionRemarks, onChange: e => setDeductionRemarks(e.target.value) })
              )
            ),
            h('div', { class: "max-h-96 overflow-y-auto border border-gray-100 rounded-xl" },
              h('table', { class: "w-full text-left text-sm" },
                h('thead', { class: "bg-gray-50 text-gray-400 uppercase font-bold text-xs tracking-wider sticky top-0" },
                  h('tr', null,
                    h('th', { class: "p-3 w-12 text-center" }, "Select"),
                    h('th', { class: "p-3" }, "Staff Profile ID"),
                    h('th', { class: "p-3" }, "Current Balance"),
                    bulkAmountType === "custom" && h('th', { class: "p-3 w-40" }, "Amount (Rs.)")
                  )
                ),
                h('tbody', { class: "divide-y text-gray-700 font-medium" },
                  users.map((u, i) => 
                    h('tr', { key: i, class: `hover:bg-gray-50/60 ${bulkSelection[u.username] ? 'bg-blue-50/30' : ''}` },
                      h('td', { class: "p-3 text-center" },
                        h('input', { type: "checkbox", checked: !!bulkSelection[u.username], onChange: () => setBulkSelection(p => ({ ...p, [u.username]: !p[u.username] })), class: "w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-0" })
                      ),
                      h('td', { class: "p-3 font-bold text-gray-900" }, u.username, " ", h('span', { class: "text-xs text-gray-400 font-normal" }, `(${u.role})`)),
                      h('td', { class: "p-3 text-gray-600" }, `Rs. ${u.balance}`),
                      bulkAmountType === "custom" && h('td', { class: "p-1" },
                        h('input', { type: "number", disabled: !bulkSelection[u.username], placeholder: "0", class: "w-full p-2 text-sm border rounded-lg font-bold disabled:bg-gray-50 text-center outline-none", value: customAmounts[u.username] || "", onChange: e => setCustomAmounts({...customAmounts, [u.username]: e.target.value}) })
                      )
                    )
                  )
                )
              )
            ),
            h('button', { onClick: executeBulkDeduction, class: "w-full md:w-auto bg-rose-600 text-white font-bold text-sm px-6 py-3 rounded-xl hover:bg-rose-700 shadow-md transition" }, "Apply Mass Ledger Adjustments")
          ),

          activeTab === "users" && user.role === "Super User" && h('div', { class: "grid md:grid-cols-3 gap-6" },
            h('div', { class: "space-y-6" },
              h('div', { class: "bg-white p-5 rounded-2xl shadow-sm border border-gray-100" },
                h('h3', { class: "font-black text-gray-800 text-md mb-3" }, "Register New Entry"),
                h('form', { onSubmit: handleCreateUser, class: "space-y-3" },
                  h('input', { type: "text", placeholder: "Username", required: true, class: "w-full p-2.5 border rounded-xl text-sm outline-none", value: newUser.username, onChange: e => setNewUser({...newUser, username: e.target.value}) }),
                  h('input', { type: "password", placeholder: "Password", required: true, class: "w-full p-2.5 border rounded-xl text-sm outline-none", value: newUser.password, onChange: e => setNewUser({...newUser, password: e.target.value}) }),
                  h('button', { type: "submit", class: "w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-blue-700 transition" }, "Save Profile")
                )
              ),
              h('div', { class: "bg-white p-5 rounded-2xl shadow-sm border border-gray-100" },
                h('h3', { class: "font-black text-gray-800 text-md mb-3" }, "Add Balance Credit"),
                h('form', { onSubmit: handleAddCredit, class: "space-y-3" },
                  h('select', { required: true, class: "w-full p-2.5 border rounded-xl text-sm bg-white font-semibold outline-none", value: creditForm.username, onChange: e => setCreditForm({...creditForm, username: e.target.value}) },
                    h('option', { value: "" }, "Choose User Target"),
                    users.map((u, i) => h('option', { key: i, value: u.username }, u.username))
                  ),
                  h('input', { type: "number", placeholder: "Credit Amount (Rs.)", required: true, class: "w-full p-2.5 border rounded-xl text-sm font-bold outline-none", value: creditForm.amount, onChange: e => setCreditForm({...creditForm, amount: e.target.value}) }),
                  h('input', { type: "text", placeholder: "Remarks/Memo", class: "w-full p-2.5 border rounded-xl text-sm outline-none", value: creditForm.remarks, onChange: e => setCreditForm({...creditForm, remarks: e.target.value}) }),
                  h('button', { type: "submit", class: "w-full bg-emerald-600 text-white p-2.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-emerald-700 transition" }, "Confirm Funding Deposit")
                )
              )
            ),
            h('div', { class: "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 md:col-span-2" },
              h('h3', { class: "font-black text-gray-800 text-md mb-4" }, "Users Directory Registry"),
              h('div', { class: "overflow-x-auto" },
                h('table', { class: "w-full text-left text-sm" },
                  h('thead', { class: "bg-gray-50 text-gray-400 uppercase font-bold text-xs tracking-wider" },
                    h('tr', { class: "border-b" },
                      h('th', { class: "p-3" }, "Username"),
                      h('th', { class: "p-3" }, "Privileges Role"),
                      h('th', { class: "p-3" }, "Active Balance"),
                      h('th', { class: "p-3 text-right" }, "Actions")
                    )
                  ),
                  h('tbody', { class: "divide-y text-gray-700 font-medium" },
                    users.map((u, i) => 
                      h('tr', { key: i, class: "hover:bg-gray-50/80" },
                        h('td', { class: "p-3 font-bold text-gray-900" }, u.username),
                        h('td', { class: "p-3" }, h('span', { class: `px-2.5 py-0.5 rounded-full text-xs font-black ${u.role === 'Super User' ? 'bg-purple-50 text-purple-700' : 'bg-gray-100 text-gray-700'}` }, u.role)),
                        h('td', { class: "p-3 font-extrabold text-blue-600" }, `Rs. ${u.balance}`),
                        h('td', { class: "p-3 text-right space-x-2 whitespace-nowrap" },
                          h('button', { onClick: () => toggleRole(u.username, u.role), class: "text-xs bg-gray-100 text-gray-600 px-2.5 py-1.5 rounded-lg font-bold hover:bg-gray-200 transition" }, "Toggle Admin"),
                          h('button', { onClick: () => deleteUser(u.username), class: "text-xs bg-rose-50 text-rose-600 px-2.5 py-1.5 rounded-lg font-bold hover:bg-rose-100 transition" }, "Purge")
                        )
                      )
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
